<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Bus System - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="page-container">

    <div class="login-card">

        <div class="logo">
            🚌
        </div>

        <h1>School Bus System</h1>

        <p class="subtitle">
            Safe and Smart Student Transportation
        </p>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="main-button">

                Login

            </button>

        </form>


        <p class="bottom-text">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</div>


<script
    src="{{ url_for('static', filename='js/script.js') }}">
</script>

</body>

</html>

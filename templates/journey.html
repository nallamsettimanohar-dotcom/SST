<!DOCTYPE html>
<html>

<head>

    <title>Journey History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1>Student Journey History</h1>

    <a
        href="/dashboard"
        class="btn btn-secondary mb-4">

        Back

    </a>


    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Bus</th>
                <th>Boarding</th>
                <th>Exit</th>
                <th>Status</th>

            </tr>

        </thead>


        <tbody>

        {% for journey in journeys %}

        <tr>

            <td>
                {{ journey.bus_number }}
            </td>

            <td>
                {{ journey.boarding_time }}
            </td>

            <td>
                {{ journey.exit_time or "-" }}
            </td>

            <td>
                {{ journey.status }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>

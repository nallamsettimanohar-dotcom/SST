<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Bus System - Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="page-container">

    <div class="login-card">

        <div class="logo">
            🚌
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            School Bus Management System
        </p>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label>Account Type</label>

                <select name="role" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="parent">
                        Parent
                    </option>

                    <option value="driver">
                        Driver
                    </option>

                    <option value="student">
                        Student
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="main-button">

                Create Account

            </button>


        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
